[project]
name = "mu-judge-nemotron"
version = "0.1.0"
description = "A fine-tuned Nemotron 3 Nano 4B judge for the mu coding agent"
requires-python = ">=3.11"
license = "MIT"
# Labelling, dataset building and the Token Factory backend use only the standard library.
dependencies = []

[project.optional-dependencies]
train = ["torch>=2.6", "transformers>=5.0", "peft>=0.17"]
# Serving on Apple silicon.
mlx = ["mlx-lm>=0.32"]

# The repository is scripts (pipeline/, serve/), not a package: install only the dependencies.
[tool.setuptools]
py-modules = []
